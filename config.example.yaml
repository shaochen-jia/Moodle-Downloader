# === Moodle Downloader config (example) ===
# Normally you don't edit this by hand - run the setup wizard instead
# (double-click the exe, or `python run.py setup`).

base_url: https://learning.monash.edu

# Where unit folders are created
root_dir: "C:/Users/you/Desktop/Uni"

week_start: 0
week_end: 12

# "manual" = sync the units listed below.
# "starred" = sync whatever you have starred on Moodle (re-star to change).
course_selection: manual

units:
  - code: FIT1045
    course_id: 12345   # from https://learning.monash.edu/course/view.php?id=12345

# Regexes matching a section title to a week ({week} = week number)
section_patterns:
  - "week\\s*0*{week}\\b"
  - "topic\\s*0*{week}\\b"

# Files from sections that match no week go here ("" = skip them)
unmatched_folder: "_Other"

skip_extensions: []
# Weekly summary note per week folder (Markdown + Word). false to disable.
weekly_notes: true

# Save captions of lecture recordings (Panopto, YouTube) as transcripts.
transcripts: true

# ── Optional AI summaries ────────────────────────────────────────────────
# Everything above works without this. Add a key and each transcript also
# gets a Summary section. Pick ONE provider:
#
#   gemini     free tier - get a key at aistudio.google.com/apikey
#   anthropic  Claude    - console.anthropic.com
#   openai     GPT       - platform.openai.com
#   deepseek   very cheap, OpenAI-compatible
#   moonshot   Kimi
#   zhipu      GLM (free flash model)
#   qwen       Alibaba Qwen
#   ollama     runs locally, no key and no cost
#
# ai_model and ai_base_url are optional - each provider has a default.
ai_provider: ""
ai_api_key: ""
ai_model: ""
ai_base_url: ""
